<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر روزانه Romi</title><link rel="stylesheet" href="style.css"></head><body data-page="journal"><div class="sparkles"></div><header><a class="logo" href="index.html">Romi <span>Daily</span> 🌷</a><nav><a href="index.html">امروز</a><a href="week.html">برنامه هفته</a><a class="active" href="journal.html">دفتر روزانه</a></nav></header><main><section class="page-head"><span class="eyebrow" data-short-date></span><h1>دفتر کوچولوی من 💌</h1><p>هر روز یک صفحه؛ حتی برای چیزهای کوچکی که خوشحالت کردند.</p></section><section class="journal-layout"><div class="panel note"><h2>امروز چه کارهایی کردی؟</h2><textarea id="note" placeholder="امروز... 🌷"></textarea><div class="save-row"><button id="saveNote" class="soft-btn">ذخیره روز ♡</button><span id="saved"></span></div></div><div class="panel"><h2>حال و امتیاز</h2><div class="moods big"><button data-mood="🥰">🥰</button><button data-mood="🙂">🙂</button><button data-mood="😌">😌</button><button data-mood="😵‍💫">😵‍💫</button><button data-mood="🥲">🥲</button></div><div class="score"><label>امتیاز امروز <b id="scoreVal">5</b>/10</label><input id="score" type="range" min="0" max="10" value="5"></div></div></section><div class="next"><span>فردا هم می‌بینمت 🌙</span><a href="index.html">برگشت به صفحه امروز <b>←</b></a></div></main><footer>هر روز لازم نیست عالی باشه؛ فقط مال خودت باشه. ♡</footer><script src="script.js"></script></body></html>
