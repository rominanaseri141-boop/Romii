<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romi Day 🌷</title><link rel="stylesheet" href="style.css"></head><body data-page="home"><div class="sparkles"></div><header><a class="logo" href="index.html">Romi <span>Daily</span> 🌷</a><nav><a class="active" href="index.html">امروز</a><a href="week.html">برنامه هفته</a><a href="journal.html">دفتر روزانه</a><a href="history.html">آرشیو</a></nav></header><main><section class="hero"><div><span class="eyebrow">یک روز قشنگ برای خودت بساز ✨</span><h1 data-full-date></h1><p>برنامه امروزت آماده‌ست؛ آروم و قدم‌به‌قدم پیش برو.</p><button id="todayBtn" class="soft-btn">برگشت به امروز ♡</button></div><div class="bunny">🐰<i class="heart">♡</i></div></section><section class="dashboard"><div class="panel"><div class="panel-title"><h2>کارهای امروز</h2><div class="progress-pill"><b id="progress">0%</b><span id="progressText">در حال شروع</span></div></div><div class="progress"><span id="bar"></span></div><div id="taskList" class="tasks"></div></div><aside class="panel classes"><h2>تقویم کلاس‌ها 🎀</h2><div id="classes"></div></aside></section><section class="panel mood"><div><h2>حال امروزت چطوره؟</h2><div class="moods"><button data-mood="🥰">🥰</button><button data-mood="🙂">🙂</button><button data-mood="😌">😌</button><button data-mood="😵‍💫">😵‍💫</button><button data-mood="🥲">🥲</button></div></div><div class="score"><label>امتیاز امروز <b id="scoreVal">5</b>/10</label><input id="score" type="range" min="0" max="10" value="5"></div></section><div class="next"><span>وقتی آماده‌ای...</span><a href="week.html">دیدن برنامه هفتگی <b>←</b></a></div></main><footer>Made with ♡ for Romi</footer><script src="script.js"></script></body></html>
